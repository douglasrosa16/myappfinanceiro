services:
  web:
    build: .
    container_name: myappfinanceiro-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8099:8000"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn my_financeiro.wsgi:application --bind 0.0.0.0:8000 --workers 3
      --access-logfile - --error-logfile -"
