<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão | myAppFinanceiro</title>
  {% include "pwa/head.html" %}
  <style>
    :root{--ink:#172e50;--muted:#65748a;--line:#dce3ec;--bg:#f3f6fa;--accent:#41d7b0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    main{width:min(480px,100%);background:white;border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:0 20px 70px #1027471c;text-align:center}
    .mark{display:grid;place-items:center;width:74px;height:74px;margin:0 auto 18px;border-radius:18px;background:#102747;color:var(--accent)}.mark svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:25px;margin:0 0 10px}p{color:var(--muted);margin:0 0 14px}.hint{font-size:14px;padding:12px;background:#edf3fb;border-radius:8px}
    button{margin-top:10px;border:0;border-radius:8px;background:var(--ink);color:white;padding:11px 18px;font:inherit;font-weight:650;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7M20 12a8 8 0 0 1-13.7 5.7M4 5v7h7M20 19v-7h-7"></path></svg></div>
    <h1>Não foi possível acessar o sistema</h1>
    <p>Confira sua conexão e tente novamente.</p>
    <p class="hint">Em celulares, tablets e computadores externos, confirme também que o Tailscale está conectado.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
  {% include "pwa/register.html" %}
</body>
</html>
