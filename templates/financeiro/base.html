<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}myfinanceiro{% endblock %}</title>
  <style>
    :root{--ink:#172e50;--muted:#65748a;--line:#dce3ec;--green:#007c64;--blue:#2769d8;--bg:#f3f6fa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:9px 12px;width:100%}
    aside{position:fixed;inset:0 auto 0 0;width:230px;background:#102747;color:white;padding:28px 20px;display:flex;flex-direction:column}
    .brand{font-size:23px;font-weight:750}.brand span{color:#41d7b0}.muted{color:var(--muted)}aside p{color:#b6c6dc;font-size:14px}
    nav{display:grid;gap:6px;margin-top:28px}nav a{color:#c5d4e7;padding:10px 12px;border-radius:8px}nav a:hover{background:#264263;color:white}
    main{margin-left:230px;padding:32px 38px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}
    h1{font-size:30px;margin:2px 0;letter-spacing:-.3px}h2{font-size:20px;margin:0 0 16px}.eyebrow{font-size:14px;color:var(--muted)}
    .button{display:inline-flex;align-items:center;border:0;background:var(--ink);color:white;padding:10px 16px;border-radius:7px}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:22px}
    .value{font-size:28px;font-weight:750;margin:8px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}.full{margin-top:22px}
    table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}.money{text-align:right;white-space:nowrap}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form p{margin:0}.form .wide{grid-column:1/-1}.actions{display:flex;gap:12px;margin-top:20px}.notice{font-size:14px;padding:12px 16px;background:#e8eef8;border-left:3px solid var(--blue);border-radius:3px;margin-bottom:20px}
    .errorlist{color:#a62f42;margin:0 0 6px;padding-left:18px}.pill{font-size:13px;border-radius:30px;padding:4px 9px;background:#edf2fa;color:var(--blue)}
    @media(max-width:900px){aside{position:static;width:100%;padding:18px}nav{display:flex;overflow:auto;margin-top:14px}main{margin:0;padding:20px 14px}.kpis,.grid,.form{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <aside>
    <div class="brand">my<span>financeiro</span></div>
    <p>Financas pessoais e profissionais</p>
    <nav aria-label="Navegacao principal">
      <a href="{% url 'dashboard' %}">Visao geral</a>
      <a href="{% url 'eventos' %}">Lancamentos</a>
      <a href="{% url 'contas' %}">Contas financeiras</a>
      <a href="{% url 'cartoes' %}">Cartoes</a>
      <a href="{% url 'categorias' %}">Categorias</a>
      <a href="{% url 'pessoas' %}">Pessoas</a>
      <a href="{% url 'importar_ofx' %}">Importar OFX</a>
    </nav>
  </aside>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
