<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | My App Financeiro</title>
  {% include "pwa/head.html" %}
  <style>
    :root{--ink:#172e50;--muted:#65748a;--line:#dce3ec;--green:#007c64;--bg:#f3f6fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    main{width:min(420px,calc(100% - 32px));background:white;border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 20px 70px #0002}
    .brand{font-size:25px;font-weight:750;margin-bottom:4px}.brand span{color:#41d7b0}.muted{color:var(--muted);margin:0 0 24px}
    label{display:grid;gap:6px;margin-top:14px}input{border:1px solid var(--line);border-radius:7px;padding:10px 12px;font:inherit;width:100%;background:white;color:var(--ink)}
    button{width:100%;margin-top:22px;border:0;background:var(--ink);color:white;padding:11px 16px;border-radius:7px;font:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.7}
    .pwa-install{margin-top:10px;background:white;color:var(--ink);border:1px solid var(--line)}.pwa-install[hidden]{display:none}
    .error{color:#a62f42;background:#fff0f2;border-left:3px solid #a62f42;padding:10px 12px;border-radius:3px}
    .loading-overlay{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:#10274766;backdrop-filter:blur(2px)}.loading-overlay[hidden]{display:none}.loading-box{display:flex;align-items:center;gap:12px;background:white;border-radius:10px;padding:16px 20px;box-shadow:0 16px 50px #10274744;font-weight:650}.loading-spinner{width:22px;height:22px;border:3px solid #dce3ec;border-top-color:#2769d8;border-radius:50%;animation:loading-spin .7s linear infinite}@keyframes loading-spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="brand">my<span>AppFinanceiro</span></div>
    <p class="muted">Acesse sua area financeira.</p>
    {% if form.errors %}
      <p class="error">Usuario ou senha invalidos.</p>
    {% endif %}
    <form method="post" id="loginForm">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        Usuario
        {{ form.username }}
      </label>
      <label>
        Senha
        {{ form.password }}
      </label>
      <button type="submit">Entrar</button>
    </form>
    <button class="pwa-install" type="button" data-pwa-install hidden>Instalar aplicativo</button>
  </main>
  <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite" hidden>
    <div class="loading-box"><span class="loading-spinner" aria-hidden="true"></span><span>Entrando...</span></div>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loadingOverlay = document.getElementById('loadingOverlay');

    loginForm.addEventListener('submit', () => {
      const button = loginForm.querySelector('button[type="submit"]');
      button.disabled = true;
      button.textContent = 'Entrando...';
      loadingOverlay.hidden = false;
    });

    window.addEventListener('pageshow', () => {
      loadingOverlay.hidden = true;
      const button = loginForm.querySelector('button[type="submit"]');
      button.disabled = false;
      button.textContent = 'Entrar';
    });
  </script>
  {% include "pwa/register.html" %}
</body>
</html>
